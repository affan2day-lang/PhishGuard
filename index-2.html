<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhishGuard · Phishing Link Detector</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#15192b;--muted:#6b7390;--line:#e3e7f2;--accent:#5b5bf0;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--chip:#eef0fb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#161a30;--text:#eef0ff;--muted:#8d95b8;--line:#262b4a;--accent:#8b8bff;--chip:#1f2442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#161a30;--text:#eef0ff;--muted:#8d95b8;--line:#262b4a;--accent:#8b8bff;--chip:#1f2442;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%;padding:env(safe-area-inset-top,0px) 16px 40px}
.wrap{max-width:720px;margin:0 auto;padding-top:32px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
#theme{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(40,50,120,.07)}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
button.go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:600;font-size:16px;cursor:pointer;transition:transform .1s}
button.go:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);border:0;color:var(--text);padding:6px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip:hover{outline:1.5px solid var(--accent)}
#result{margin-top:20px;display:none}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.gauge{position:relative;width:130px;height:130px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.gauge .n small{font-size:11px;font-weight:500;color:var(--muted)}
#ring{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .3s}
.verdict{font-size:22px;font-weight:700}
.url{color:var(--muted);font-size:13px;word-break:break-all;margin-top:4px}
ul{list-style:none;padding:0;margin:20px 0 0}
li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;display:flex;gap:10px;font-size:14px;animation:in .35s both}
li b{color:var(--bad);min-width:34px}
li.good b{color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:15px;margin:28px 0 10px;color:var(--muted);font-weight:600}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.hist span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-weight:700;flex:none}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Phish<span>Guard</span> 🛡️</h1><p class="sub">Paste a link. Get a risk score. Nothing leaves your browser.</p></div>
    <button id="theme" title="Toggle theme">🌓</button>
  </header>

  <div class="card">
    <div class="row">
      <input id="u" placeholder="https://example.com/login" autocomplete="off" spellcheck="false">
      <button class="go" id="go">Scan</button>
    </div>
    <div class="chips">Try:
      <button class="chip">https://www.google.com</button>
      <button class="chip">http://paypal-secure-login.xyz/verify</button>
      <button class="chip">http://192.168.1.1/bank/login</button>
      <button class="chip">https://paypall.com/signin</button>
    </div>

    <div id="result">
      <div class="top">
        <div class="gauge">
          <svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="ring" cx="65" cy="65" r="54" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/></svg>
          <div class="n"><span id="num">0</span><small>/ 100 risk</small></div>
        </div>
        <div><div class="verdict" id="verdict"></div><div class="url" id="shown"></div></div>
      </div>
      <ul id="reasons"></ul>
    </div>
  </div>

  <h2>Recent scans</h2>
  <div class="card" id="history" style="padding:8px 20px"><div class="sub" style="padding:12px 0">Nothing yet.</div></div>
  <footer>Heuristic-based learning project · MIT · it only analyzes the URL text and can be wrong</footer>
</div>

<script>
const SUS_TLD=["zip","mov","xyz","top","tk","ml","ga","cf","gq","click","link","work","support","rest"];
const SHORT=["bit.ly","tinyurl.com","t.co","goo.gl","ow.ly","is.gd","buff.ly","cutt.ly","rb.gy"];
const KEYS=["login","signin","verify","update","secure","account","password","confirm","banking","wallet","suspend","unlock","billing","payment"];
const BRANDS=["paypal","google","facebook","instagram","apple","microsoft","amazon","netflix","bkash","nagad","binance","dhl","fedex","whatsapp","linkedin"];

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length);

function brandCheck(host){
  const labels=host.split(/[.\-]/), root=host.split(".").slice(-2)[0];
  for(const b of BRANDS){
    if(root===b)continue;
    if(labels.includes(b)||host.replace(/-/g,"").includes(b))return [b,"contains the brand name on a different domain"];
    for(const l of labels)if(l.length>4&&sim(l,b)>0.8)return [b,"looks like a misspelling"];
  }
  return null;
}

function analyze(input){
  const raw=input.trim(); let u;
  try{u=new URL(raw.includes("://")?raw:"http://"+raw)}catch(e){return null}
  const host=u.hostname.toLowerCase(), r=[]; let s=0;
  const add=(p,m)=>{s+=p;r.push([p,m])};
  if(u.protocol!=="https:")add(10,"Does not use HTTPS");
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host)||host.startsWith("["))add(30,"Uses a raw IP address instead of a domain");
  if(raw.split("?")[0].includes("@"))add(25,"Contains '@' which can hide the real destination");
  if(host.includes("xn--"))add(20,"Punycode domain (possible lookalike characters)");
  if(raw.length>75)add(10,"Very long URL");
  if((host.match(/\./g)||[]).length>=4)add(15,"Too many subdomains");
  if((host.match(/-/g)||[]).length>=3)add(10,"Many hyphens in the domain");
  if(SUS_TLD.includes(host.split(".").pop()))add(15,"Suspicious top-level domain");
  if(SHORT.includes(host))add(15,"URL shortener hides the final destination");
  const hits=KEYS.filter(k=>raw.toLowerCase().includes(k));
  if(hits.length)add(Math.min(5*hits.length,20),"Suspicious keywords: "+hits.join(", "));
  const bc=brandCheck(host);
  if(bc)add(30,`Possible "${bc[0]}" impersonation (${bc[1]})`);
  if(raw.replace(/^\w+:\/\//,"").includes("//"))add(10,"Extra '//' in URL (possible redirect trick)");
  s=Math.min(s,100);
  return {url:raw,score:s,reasons:r,verdict:s>=60?"Dangerous":s>=30?"Suspicious":"Looks OK"};
}

const $=id=>document.getElementById(id), C=339.3;
const color=s=>s>=60?"var(--bad)":s>=30?"var(--warn)":"var(--ok)";
const icon=s=>s>=60?"🚨":s>=30?"⚠️":"✅";
let hist=[];

function scan(v){
  const res=analyze(v||$("u").value);
  if(!res){$("u").focus();return}
  $("u").value=res.url;
  $("result").style.display="block";
  $("shown").textContent=res.url;
  $("verdict").textContent=icon(res.score)+" "+res.verdict;
  $("verdict").style.color=color(res.score);
  const ring=$("ring"); ring.style.stroke=color(res.score);
  ring.style.strokeDashoffset=C;
  requestAnimationFrame(()=>requestAnimationFrame(()=>ring.style.strokeDashoffset=C*(1-res.score/100)));
  let n=0;const t=setInterval(()=>{n+=Math.max(1,Math.ceil((res.score-n)/6));if(n>=res.score){n=res.score;clearInterval(t)}$("num").textContent=n},25);
  if(!res.score)$("num").textContent=0;
  const ul=$("reasons");ul.innerHTML="";
  if(!res.reasons.length){const li=document.createElement("li");li.className="good";li.innerHTML="<b>✓</b><span>No red flags found in the URL text.</span>";ul.appendChild(li)}
  res.reasons.forEach(([p,m],i)=>{const li=document.createElement("li");li.style.animationDelay=i*70+"ms";
    const b=document.createElement("b");b.textContent="+"+p;const sp=document.createElement("span");sp.textContent=m;li.append(b,sp);ul.appendChild(li)});
  hist=[res,...hist.filter(h=>h.url!==res.url)].slice(0,6);
  renderHist();
}
function renderHist(){
  const box=$("history");box.innerHTML="";
  hist.forEach(h=>{const d=document.createElement("div");d.className="hist";
    const a=document.createElement("span");a.textContent=h.url;
    const t=document.createElement("span");t.className="tag";t.style.color=color(h.score);t.textContent=icon(h.score)+" "+h.score;
    d.append(a,t);d.onclick=()=>scan(h.url);box.appendChild(d)});
}
$("go").onclick=()=>scan();
$("u").addEventListener("keydown",e=>{if(e.key==="Enter")scan()});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>scan(c.textContent));
$("theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==="dark";d.dataset.theme=dark?"light":"dark"};
</script>
</body>
</html>
